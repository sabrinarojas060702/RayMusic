<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RayMusic - Buscador de Música</title>

    <!-- SEO -->
    <meta name="description" content="RayMusic - Busca y descarga tu música favorita de YouTube de forma rápida y sencilla.">
    <meta name="keywords" content="música, descargar música, buscador de música, youtube música, RayMusic">
    <meta name="author" content="Severo Rojas">
    <meta name="robots" content="index, follow">

    <!-- Open Graph (para compartir en redes sociales) -->
    <meta property="og:title" content="RayMusic - Buscador de Música">
    <meta property="og:description" content="Busca y descarga tu música favorita de YouTube de forma rápida y sencilla.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="imagenes/reproductor-de-musica.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="RayMusic - Buscador de Música">
    <meta name="twitter:description" content="Busca y descarga tu música favorita de YouTube.">
    <meta name="twitter:image" content="imagenes/reproductor-de-musica.png">

    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="imagenes/reproductor-de-musica.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="titulopagins"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#B0AEF5"><path d="M287-167q-47-47-47-113t47-113q47-47 113-47 23 0 42.5 5.5T480-418v-422h240v160H560v400q0 66-47 113t-113 47q-66 0-113-47Z"/></svg>RayMusic</h1>
            <h3 class="title">
                Tu descargador de  <span class="name-blue">Música</span>  de confianza
            </h3>
            
            <p class="subtitle">Que música vamos a buscar hoy?</p>
            
            <div class="search-container">
                <input 
                    type="text" 
                    class="search-input" 
                    placeholder="Busca tu música favorita..."
                    id="searchInput"
                    autocomplete="off"
                >
                <button class="search-button" id="searchButton">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
            </div>
        </div>
        <div class="foto"></div>
    </div>
    
    <!-- Modal de resultados -->ne
    <div id="resultsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Resultados de búsqueda</h2>
                <button id="closeModal" class="close-btn">&times;</button>
            </div>
            <div id="modalResults" class="modal-results"></div>
        </div>
    </div>
    
    <!-- Widget de Historial de Descargas -->
    <div id="historyWidget" class="history-widget collapsed">
        <div class="history-header" onclick="toggleHistory()">
            <svg class="history-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span class="history-title">Historial de Descargas</span>
            <span class="history-count">3</span>
        </div>
        <div class="history-content">
            <div class="history-item">
                <div class="history-item-info">
                    <div class="history-item-title">Bohemian Rhapsody</div>
                    <div class="history-item-artist">Queen</div>
                </div>
                <div class="history-item-status completed">✓</div>
            </div>
            <div class="history-item">
                <div class="history-item-info">
                    <div class="history-item-title">Blinding Lights</div>
                    <div class="history-item-artist">The Weeknd</div>
                </div>
                <div class="history-item-status completed">✓</div>
            </div>
            <div class="history-item">
                <div class="history-item-info">
                    <div class="history-item-title">Shape of You</div>
                    <div class="history-item-artist">Ed Sheeran</div>
                </div>
                <div class="history-item-status completed">✓</div>
            </div>
        </div>
    </div>
    
    <!-- Cargar configuración y aplicación -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
