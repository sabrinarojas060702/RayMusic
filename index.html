<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador de Música - Severo Rojas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="imagenes/reproductor-de-musica.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="titulopagins"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#B0AEF5"><path d="M287-167q-47-47-47-113t47-113q47-47 113-47 23 0 42.5 5.5T480-418v-422h240v160H560v400q0 66-47 113t-113 47q-66 0-113-47Z"/></svg>RayMusic</h1>
            <h1 class="title">
                Hola <span class="name-blue">Severo</span> <span class="name-purple">Rojas</span>
            </h1>
            
            <p class="subtitle">Que música vamos a descargar hoy?</p>
            
            <div class="search-container">
                <input 
                    type="text" 
                    class="search-input" 
                    placeholder="Inserte la música que se va a descargar..."
                    id="searchInput"
                    autocomplete="off"
                >
                <button class="search-button" id="searchButton">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
            </div>
        </div>
        <div class="foto"></div>
    </div>
    
    <!-- Modal de resultados -->
    <div id="resultsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Resultados de búsqueda</h2>
                <button id="closeModal" class="close-btn">&times;</button>
            </div>
            <div id="modalResults" class="modal-results"></div>
        </div>
    </div>
    
    <!-- Historial de búsquedas -->
    <div class="historial-wrapper">
        <div class="historial-header">
            <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#B0AEF5"><path d="M480-120q-138 0-240.5-91.5T122-440h82q14 104 92.5 172T480-200q117 0 198.5-81.5T760-480q0-117-81.5-198.5T480-760q-69 0-129 30t-101 80h110v80H120v-240h80v94q51-64 124.5-99T480-840q75 0 140.5 28.5t114 77q48.5 48.5 77 114T840-480q0 75-28.5 140.5t-77 114q-48.5 48.5-114 77T480-120Zm112-192L440-464v-216h80v184l128 128-56 56Z"/></svg>
            <span>Historial de búsquedas</span>
            <button id="clearHistory" title="Limpiar historial">
                <svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px" fill="currentColor"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
            </button>
        </div>
        <div id="historialLista" class="historial-lista">
            <p class="historial-vacio">Aún no has buscado nada. ¡Empieza buscando tu canción favorita!</p>
        </div>
    </div>

    <!-- Cargar configuración y aplicación -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
